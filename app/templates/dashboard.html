<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><title>Proje Talepleri</title></head><body><main><header><strong>PLAK INDUSTRIES</strong><span>YÖNETİM</span></header><h1>Proje Talepleri</h1><p id="dashboard-status" role="status">Kayıtlar yükleniyor...</p><ul id="lead-list"></ul></main><script>
fetch('/api/leads', { headers: { 'X-Admin-Secret': window.ADMIN_SECRET || '' } }).then((response) => response.json()).then((data) => { const status = document.querySelector('#dashboard-status'); if (!data.basari) { status.textContent = 'Kayıtlar yüklenemedi.'; return; } status.textContent = data.leadler.length ? '' : 'Henüz proje talebi yok.'; data.leadler.forEach((lead) => { const item = document.createElement('li'); item.textContent = `${lead.isim} - ${lead.telefon} - ${lead.mesaj || 'Özet yok'}`; document.querySelector('#lead-list').append(item); }); });
</script></body></html>
